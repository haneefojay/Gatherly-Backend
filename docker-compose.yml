version: '3.8'

services:
  behemoth_fastapi:
    build: .
    ports:
      - 8000:8000
    environment:
      - DEBUG=true
      - PORT=8000
      - LOGFIRE_TOKEN=your_token_here
      - POSTGRES_DATABASE_URL=postgresql+asyncpg://behemoth:backend@behemoth_db:5432/behemoth_db
      - REDIS_BROKER_URL=redis://redis:6379/0
      - SECRET_KEY=your_secret_key_here
    depends_on:
      behemoth_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - behemoth_network

  behemoth_db:
    image: postgres:15-alpine
    volumes:
      - behemoth_volume:/var/lib/postgresql/data
    expose:
      - 5432
    environment:
      - POSTGRES_USER=behemoth
      - POSTGRES_PASSWORD=backend
      - POSTGRES_DB=behemoth_db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U behemoth -d behemoth_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - behemoth_network

  redis:
    image: redis:7-alpine
    expose:
      - 6379
    volumes:
      - redis_volume:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - behemoth_network

volumes:
  behemoth_volume:
  redis_volume:


networks:
  behemoth_network:
